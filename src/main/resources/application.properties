spring.application.name=review-parser
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/reviews;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.indent-output=true
parser.workers=4
parser.queue-capacity=32
parser.demo-enabled=true
parser.schedule-delay-ms=60000
parser.schedule-initial-delay-ms=60000
server.error.include-message=always
